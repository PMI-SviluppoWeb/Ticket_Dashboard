services:
  ticket-dashboard:
    build: .
    container_name: ticket-dashboard
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - IMAP_POLL_INTERVAL_MS=300000
      # Polling caselle Gmail (OAuth). APP_BASE_URL (Redirect URI pubblico)
      # e GOOGLE_GMAIL_CLIENT_* arrivano da env_file .env — vedi DEPLOY.md §9.
      - GMAIL_POLL_INTERVAL_MS=300000
      - WEBHOOK_URL=http://127.0.0.1:3001/api/hooks/email
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
