name: Deploy to Windows Server

on:
  push:
    branches: [ main ] # o master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd
        working-directory: C:\Users\Mirko Pandolfi\Desktop\Ticket_Dashboard
    steps:
      # 1. Scarica il codice aggiornato da GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Ogni comando e' uno step separato: se fallisce, il job va in errore
      - name: Git pull
        run: git pull origin main

      - name: Install dipendenze
        run: npm install

      - name: Build
        run: npm run build

      - name: Riavvia app
        run: pm2 restart Ticket_Dashboard
