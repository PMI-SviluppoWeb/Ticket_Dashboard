name: Deploy su server Windows

on:
  push:
    branches: [main]

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: pm2 restart Ticket_Dashboard --update-env
      - run: pm2 restart mcp-ticket-server --update-env
