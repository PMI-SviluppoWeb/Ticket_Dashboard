name: Deploy su container Proxmox

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      # clean: false preserva i file gitignored tra un deploy e l'altro
      # (.env e uploads/ non devono venire cancellati dal checkout)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      # Sorgente di verita' fuori dal repo: se il workspace viene ricreato
      # da zero il . resta comunque disponibile
      - name: Ripristina .env dai secret
        run: cp /opt/secrets/ticket-dashboard.env .env

      - name: Build e avvio
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Stato servizi
        run: docker compose ps
