name: Deploy to Windows Server

on:
  push:
    branches: [ main ] # o master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # 1. Scarica il codice aggiornato da GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Esegue i comandi direttamente nella cartella del progetto sul server
      - name: Install, Build and Restart
        run: |
          cd C:\Users\Mirko Pandolfi\Desktop\Ticket_Dashboard
          git pull origin main
          npm install
          npm run build
          pm2 restart Ticket_Dashboard
        shell: cmd